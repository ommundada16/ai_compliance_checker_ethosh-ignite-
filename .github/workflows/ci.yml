name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. CI that queues behind
# itself tells you about a commit you already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ api/ tools/ tests/

      - name: Tests
        # Integration tests skip themselves when Qdrant and Ollama are absent,
        # so CI runs everything that does not need a live service. The slow
        # marker covers the parser-fidelity tests, which open both PDFs and are
        # exactly what catches a silent redefinition of a clause -- so they run
        # here even though they are slow.
        run: pytest tests/ -q -p no:warnings

  gold-set:
    name: Gold set integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Rebuild the frozen artefacts from the source PDFs
        run: |
          python tools/build_clause_corpus.py
          python tools/build_protocol_passages.py
          python tools/build_gold_retrieval.py

      - name: Fail if anything drifted
        # The gold set is frozen but the parser is live code. A cleaning tweak
        # or boundary change silently redefines what a clause IS, while the
        # committed labels keep pointing at the old IDs. Nothing would fail;
        # the numbers would just stop meaning what they did. This is the alarm.
        run: |
          if ! git diff --quiet eval_data/; then
            echo "::error::Rebuilding the gold set produced different output."
            echo "The parser changed the definition of a clause or a passage."
            echo "If that was intended, rebuild locally, re-check that the gold"
            echo "labels still resolve, and commit eval_data/ with the change."
            git diff --stat eval_data/
            exit 1
          fi
          echo "Gold set reproduces byte-for-byte."

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
